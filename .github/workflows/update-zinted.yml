name: Update Zinted VPN

on:
  woon:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Zinted VPN
        run: python scripts/update.py

      - name: Save changes
        run: |
          git config user.name "Zinted VPN Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Zinted VPN.txt"
          git diff --cached --quiet || git commit -m "Update Zinted VPN"
          git push
