name: Update Zinted VPN

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update Zinted VPN
        - name: Save changes
  run: |
    git config user.name "Zinted VPN"
    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

    git add "Zinted VPN.txt"

    if git diff --cached --quiet; then
      echo "No changes"
      exit 0
    fi

    git commit -m "Auto update VPN subscription"
    git push

      - name: Save changes
        run: |
          git config user.name "Zinted VPN Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Zinted VPN.txt"
          git diff --cached --quiet || git commit -m "Update Zinted VPN"
          git push
